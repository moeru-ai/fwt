allowBuilds:
  esbuild: false

minimumReleaseAgeExclude:
  - '@xsai/shared@1.0.0-beta.9'
  - '@xsai/text-chat@1.0.0-beta.9'
  - '@xsai/text-messages@1.0.0-beta.9'
  - '@xsai/text-responses@1.0.0-beta.9'
  - '@xsai/text@1.0.0-beta.9'

minimumReleaseAgeExcludePrune: true

shellEmulator: true

trustPolicy: no-downgrade

trustPolicyExclude:
  - '@vercel/detect-agent@1.2.7'
packages:
  - docs
  - examples/*
  - packages/*

catalogs:
  dev:
    '@kwaa/skills': ^0.1.0
    '@moeru/eslint-config': ^0.1.0-beta.20
    '@moeru/tsconfig': ^0.1.0-beta.20
    '@types/node': ^26.6.4
    bumpp: ^12.3.0
    cspell: ^10.4.0
    eslint: ^10.12.0
    eslint-plugin-oxlint: ^1.87.0
    oxlint: ^1.87.0
    skills-npm: ^4.1.0
    tsdown: ^0.23.7
    turbo: ^2.11.7
    typescript: ~6.0.3
    vitest: ^5.1.0
  inlined:
    '@moeru/cliff': ^0.2.0
    '@moeru/std': ^0.1.0-beta.20
    '@valibot/to-json-schema': ^1.8.0
    '@xsai/text': ^1.0.0-beta.9
    '@xsai/text-chat': ^1.0.0-beta.9
    '@xsai/text-messages': ^1.0.0-beta.9
    '@xsai/text-responses': ^1.0.0-beta.9
    smol-toml: ^1.9.1
    valibot: ^1.5.0
    xdg-basedir: ^5.1.0
